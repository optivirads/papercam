<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <!-- App Identity -->
    <title>PSC Master — Kerala PSC Exam Preparation</title>
    <meta name="description" content="Kerala PSC exam preparation app with mock tests, previous year questions, video lessons, and AI-powered question bank for LDC, VFA, KAS, and Degree Level exams." />
    <meta name="author" content="PSC Master" />

    <!-- Theme & Mobile Chrome -->
    <meta name="theme-color" content="#0d1322" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PSC Master" />

    <!-- Icons -->
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512x512.png" />
    <link rel="apple-touch-icon" href="/icon-512x512.png" />

    <!-- Open Graph / Social Sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="PSC Master — Kerala PSC Exam Preparation" />
    <meta property="og:description" content="Free Kerala PSC exam prep with mock tests, PYQ papers, video lessons, and AI-powered question bank." />
    <meta property="og:image" content="/icon-512x512.png" />

    <!-- Prevent phone number detection -->
    <meta name="format-detection" content="telephone=no" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
